[package]
name = "ffdm-resolver"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Reusable Rust resource extraction, format selection and download plans"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
async-trait = "0.1"
base64 = "0.22"
bbdown-core = "=0.5.0"
ctr = { version = "0.9", features = ["zeroize"] }
futures-util = "0.3"
getrandom = "0.3"
httpdate = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
reqwest_media = { package = "reqwest", version = "0.12", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "fs", "process"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
ytdown = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
bytes = "1"
