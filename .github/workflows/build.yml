name: Build desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Prepare bundled FFmpeg for desktop tests
        run: sh scripts/build-ffmpeg-macos.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: sh scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FFDownload-macos-arm64
          path: |
            dist/FFDownload-*-macos-arm64.dmg
            dist/FFDownload-*-macos-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            nasm
            yasm
            mingw-w64-ucrt-x86_64-gcc
      - name: Build bundled FFmpeg from pinned source
        shell: msys2 {0}
        run: sh scripts/build-ffmpeg-windows.sh
      - name: Check bundled FFmpeg outside MSYS2
        shell: pwsh
        run: |
          & src-tauri/resources/ffmpeg.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg did not start in Windows' }
          & src-tauri/resources/ffmpeg.exe -hide_banner -loglevel error -i tests/fixtures/sample-av.mp4 -map 0:v:0 -map 0:a:0 -c copy -y "$env:RUNNER_TEMP\ffdownload-remux.mp4"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg could not remux H.264/AAC' }
          if ((Get-Item "$env:RUNNER_TEMP\ffdownload-remux.mp4").Length -lt 1000) { throw 'Remux output is unexpectedly small' }
      - run: cargo test --workspace --locked
      - name: Build NSIS installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FFDownload-windows-x64
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FFDownload-*
          path: release
          merge-multiple: true
      - name: Publish release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "FFDownload $GITHUB_REF_NAME" \
            --notes "macOS Apple Silicon DMG/ZIP and Windows x64 NSIS installer. Preview builds are unsigned; see README for requirements and source." \
            --verify-tag
